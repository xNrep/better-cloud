services:
  - type: web
    name: better-cloud-data-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: better-cloud-data-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: better-cloud-data-db
    plan: free
